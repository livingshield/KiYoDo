<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="6" />

  <!-- Outer ambient glow ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#primaryGrad)" stroke-width="4" opacity="0.3" stroke-dasharray="16 12" />

  <!-- Center Download Arrow with Play Shape -->
  <g filter="url(#glow)" transform="translate(0, -6)">
    <!-- Stylized Play polygon background glow -->
    <path d="M 210,135 L 345,245 L 210,355 Z" fill="url(#accentGrad)" opacity="0.35" transform="scale(0.8) translate(75, 45)" />

    <!-- Download Arrow Shaft & Head -->
    <path d="M 226,130 L 286,130 L 286,240 L 350,240 L 256,350 L 162,240 L 226,240 Z" fill="url(#primaryGrad)" />

    <!-- Bottom Tray / Drive Bar -->
    <rect x="156" y="380" width="200" height="24" rx="12" fill="url(#accentGrad)" />
  </g>
</svg>
